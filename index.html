<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparv Plattformsspel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 70%, #90EE90 70%, #90EE90 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            text-align: center;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        canvas {
            border: 4px solid #333;
            background: #87CEEB;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            max-width: 95vw;
            max-height: 80vh;
        }

        #info {
            margin-top: 20px;
            color: #333;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
        }

        .controls {
            margin: 10px 0;
            font-size: 14px;
        }

        .controls strong {
            color: #d35400;
        }

        h1 {
            color: #2c3e50;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        #score {
            font-size: 24px;
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>🐦 Sparv Plattformsspel 🐦</h1>
        <canvas id="gameCanvas" width="1400" height="800"></canvas>
        <div id="info">
            <div id="score">Poäng: 0</div>
            <div class="controls">
                <strong>Kontroller:</strong>
                ← → Piltangenter = Rörelse |
                Mellanslag = Hoppa |
                Håll Mellanslag = Flyg (begränsad energi)
            </div>
            <div class="controls">
                Samla mynt och undvik hinder! Flygenergyn laddas när du står på marken.
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
